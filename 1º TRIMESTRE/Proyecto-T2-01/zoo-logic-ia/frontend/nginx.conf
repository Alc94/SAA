server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # La API ASP.NET se expone bajo /api (mismo origen, sin CORS)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger opcional para la documentación de la API
    location /swagger {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Archivos estáticos con caché larga (llevan hash en el nombre)
    location ~* \.(?:js|css|woff2?|svg|ico|png|jpg)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Fallback de SPA para las rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
